services:
  app:
    build: .
    ports:
      - 9090:9090
    depends_on:
      - mysql-db
      - worker
    env_file:
      - ./vars.env

  worker:
    build: ./worker
    expose:
      - "8000"
    depends_on:
      - mysql-db
    env_file:
      - ./vars.env
    volumes:
      - exports:/var/lib/shopfloor/exports

  mysql-db:
    image: mysql:8.0
    expose:
      - "3306"
    env_file:
      - ./vars.env

volumes:
  exports:
